<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>90 Dias de Liberdade</title><meta name="robots" content="noindex"><meta name="theme-color" content="#f6f1e7"><style>
:root{--f:#f6f1e7;--t:#23261f;--s:#6d6f64;--l:#e0d8c8;--c:#fffdf8;--d:#8a5a1f;--v:#2f4a3a;--r:#b3321f}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--f);color:var(--t);font-size:18px;line-height:1.5;font-variant-numeric:lining-nums}
.app{max-width:480px;margin:0 auto;padding:16px 16px 92px}h1{font-size:26px;line-height:1.2;margin-bottom:6px}h2{font-size:21px;margin:16px 0 8px}.s{color:var(--s);font-size:15px}
.c{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:16px;margin:12px 0}.n{font-size:64px;font-weight:900;color:var(--v);line-height:1}
.b{display:block;width:100%;min-height:56px;border:0;border-radius:12px;background:var(--v);color:#fff;font:800 18px inherit;cursor:pointer;margin-top:10px}.b.sos{background:var(--r);min-height:66px;font-size:21px}.b.v{background:transparent;color:var(--t);border:2px solid var(--l)}
.ref{color:var(--d);font-weight:800;font-size:15px}.acao{background:#eef1e6;border-radius:10px;padding:12px;margin-top:10px;font-weight:700}
ol{margin:6px 0 6px 22px}ol li{margin:8px 0}.ch{display:flex;align-items:center;gap:12px;min-height:46px;font-weight:600}.ch input{width:24px;height:24px;accent-color:var(--v)}
.dias{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:8px}.dias button{aspect-ratio:1;border:1px solid var(--l);background:var(--c);border-radius:6px;font-size:13px;font-weight:700;color:var(--t)}.dias button.on{background:var(--v);color:#fff}
textarea{width:100%;min-height:96px;padding:12px;border:1px solid var(--l);border-radius:10px;font:16px inherit;background:#fff;color:var(--t)}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fffdf8;border-top:1px solid var(--l);display:flex;justify-content:center}.nav div{max-width:480px;width:100%;display:flex}.nav button{flex:1;min-height:60px;background:none;border:0;color:var(--s);font:700 13px inherit}.nav button.on{color:var(--v)}
</style></head><body>
<div class="app" id="c"></div><div class="nav"><div><button type="button" data-a="hoje">Hoje</button><button type="button" data-a="sos">Socorro</button><button type="button" data-a="todos">Devocionais</button><button type="button" data-a="mapa">Gatilhos</button></div></div>
<script>
var D=[["Salmos 32:3-5", "O silêncio adoece", "Davi escondeu o pecado e definhou por dentro. Quando abriu o jogo com Deus, o peso saiu. O segredo é o oxigênio do vício.", "Conte a Deus, em voz alta, exatamente como foi a última queda."], ["1 João 1:9", "Ele perdoa de verdade", "A promessa não depende de você estar bem. Depende de Deus ser fiel. Confesse e receba, sem negociar.", "Escreva: \"hoje eu fui perdoado\"."], ["Provérbios 28:13", "Esconder não resolve", "Quem esconde não vai para a frente. Quem confessa e larga encontra misericórdia. Os dois passos andam juntos.", "Liste o que ainda está escondido no celular e apague."], ["Tiago 5:16", "Alguém precisa saber", "Pecado confessado só a Deus continua no escuro da sua casa. Cura vem quando um irmão ora junto.", "Escolha um homem de confiança para contar."], ["João 8:32", "A verdade dói e solta", "Mentir para si mesmo é a primeira corrente. \"Só mais essa vez\" é mentira. Chame o vício pelo nome.", "Escreva quanto tempo esse vício já tirou de você."], ["Salmos 139:23-24", "Peça para ser examinado", "Davi pede que Deus olhe o que ele mesmo não enxerga. Coragem é pedir isso sabendo o que vai aparecer.", "Ore essa passagem hoje, devagar."], ["Romanos 7:15", "Paulo também lutou", "\"Faço o que não quero.\" Essa frase é de um apóstolo. Luta não é prova de que você não é de Deus.", "Anote o que você quer e o que tem feito."], ["Romanos 8:1", "Sem condenação", "Quem está em Cristo não vive mais sob sentença. A culpa que paralisa não vem de Deus.", "Quando a culpa falar, responda com esse versículo."], ["Lamentações 3:22-23", "Hoje é novo", "As misericórdias se renovam toda manhã. Ontem não manda em hoje.", "Comece o dia agradecendo antes de pegar o celular."], ["Filipenses 1:6", "Ele termina o que começa", "Você não está neste caminho por acaso. Quem começou a obra vai até o fim com você.", "Escreva por que você começou estes 90 dias."], ["Tiago 1:14-15", "Como a queda nasce", "Primeiro o desejo atrai, depois concebe, depois vem o pecado. A hora de agir é no começo, não no fim.", "Descreva o que acontece nos 10 minutos antes da queda."], ["Provérbios 4:23", "Guarde a porta", "De dentro do coração sai a vida inteira. Porta aberta não é detalhe.", "Tire do alcance o aplicativo que mais te derruba."], ["Mateus 26:41", "Vigiar é rotina", "Jesus avisou: o espírito quer, mas a carne é fraca. Oração sem vigilância não sustenta.", "Marque o horário em que você mais cai e tenha um plano para ele."], ["1 Pedro 5:8", "Ele ronda", "O inimigo procura hora e lugar. Ele conhece a sua rotina. Conheça também.", "Anote os 3 horários mais perigosos da semana."], ["Provérbios 22:3", "O prudente sai antes", "Quem é sábio vê o perigo e se afasta. Quem é ingênuo passa adiante e paga.", "Mude uma coisa hoje na rota da noite."], ["Gênesis 39:12", "José correu", "José não ficou argumentando. Largou a capa e fugiu. Às vezes vencer é sair correndo.", "Na próxima tentação, saia do cômodo na hora."], ["2 Timóteo 2:22", "Fuja e siga", "Paulo manda fugir e seguir junto com outros. Só fugir deixa um vazio.", "Combine algo para fazer com alguém esta semana."], ["1 Coríntios 10:13", "Sempre há saída", "Deus não deixa a tentação passar do que dá para aguentar. Junto dela, vem a saída. Procure a porta.", "Defina qual é a sua saída: levantar, andar, ligar."], ["Efésios 4:27", "Não dê lugar", "Brecha pequena vira território. Não existe \"só olhar um pouco\".", "Feche hoje uma brecha que você vinha fingindo não ver."], ["Salmos 119:37", "Desvia os meus olhos", "O salmista pede ajuda para os olhos. Pedir ajuda para o básico é sabedoria.", "Faça essa oração antes de abrir o celular."], ["Romanos 12:2", "Mente nova, vida nova", "A mudança vem de dentro, por renovação. Não é só parar: é pensar diferente.", "Separe 5 minutos sem tela depois de acordar."], ["Filipenses 4:8", "Escolha no que pensar", "Sua mente vai se alimentar de alguma coisa. Paulo dá o cardápio.", "Escreva 3 coisas boas e verdadeiras de hoje."], ["2 Coríntios 10:5", "Prenda o pensamento", "Pensamento não entra e fica sozinho: ele é deixado ficar. Prenda antes de crescer.", "Quando vier a imagem, diga em voz alta: \"não\"."], ["Salmos 119:11", "Palavra guardada", "Versículo decorado está disponível às 11 da noite, quando a Bíblia está longe.", "Decore 1 Coríntios 10:13."], ["Jó 31:1", "Aliança com os olhos", "Jó fez um trato com os próprios olhos. Decisão tomada antes da hora vale mais que força na hora.", "Escreva o seu trato e assine."], ["Mateus 5:28", "Começa no olhar", "Jesus foi na raiz: antes do ato, o olhar. Tratar a raiz liberta mais do que podar o galho.", "Por um dia inteiro, desvie o olhar na primeira vez."], ["Mateus 5:8", "Coração limpo vê", "Pureza não é prêmio de quem nunca caiu. É caminho para enxergar Deus.", "Peça um coração limpo, com as suas palavras."], ["Salmos 51:10", "Cria em mim", "Davi não pede conserto, pede criação. Deus faz o que você não consegue fazer.", "Leia o Salmo 51 inteiro."], ["Colossenses 3:2", "Olhe para cima", "Para onde a mente aponta, a vida vai atrás.", "Troque 10 minutos de rede social por leitura."], ["Isaías 26:3", "Mente firme, paz", "Paz é consequência de mente firmada em Deus. Ansiedade é o terreno preferido da recaída.", "Respire fundo 10 vezes repetindo esse versículo."], ["1 Coríntios 6:19-20", "Templo", "O corpo não é seu para fazer o que quiser. Foi comprado por alto preço.", "Faça 20 minutos de caminhada hoje."], ["1 Coríntios 6:18", "Fujam", "Essa ordem é uma das mais diretas da Bíblia: fugir, não negociar.", "Bloqueie o que ainda dá para bloquear."], ["1 Tessalonicenses 4:3-4", "Saber controlar o corpo", "Santidade inclui aprender a governar o próprio corpo. Aprender leva tempo.", "Durma hoje no horário combinado, sem celular na cama."], ["Gálatas 5:22-23", "Fruto, não esforço", "Domínio próprio é fruto do Espírito. Fruto cresce com o tempo, ligado à raiz.", "Peça domínio próprio antes de cada refeição hoje."], ["Provérbios 25:28", "Cidade sem muro", "Sem domínio próprio, o homem fica aberto a qualquer ataque.", "Escolha um muro novo: horário, lugar, regra."], ["1 Coríntios 9:27", "Treino duro", "Paulo treinava o corpo como atleta. Fé também tem disciplina.", "Faça algo difícil hoje de propósito: banho frio, jejum de uma refeição."], ["2 Timóteo 1:7", "Não é medo", "Deus deu poder, amor e equilíbrio. Medo e vergonha não vieram dele.", "Enfrente hoje uma coisa que você vem adiando."], ["Romanos 6:12-13", "Quem manda aqui", "O pecado não tem mais direito de reinar. Ofereça o corpo para outra coisa.", "Use as mãos para servir alguém hoje."], ["Romanos 13:14", "Não alimente", "Não faça planos para a carne. Comida que não entra não engorda o vício.", "Tire do caminho o que você guardava \"por via das dúvidas\"."], ["Gálatas 5:16", "Ande no Espírito", "A vitória vem de andar em outra direção, não só de lutar parado.", "Ouça um louvor no horário de risco."], ["Gênesis 2:18", "Não é bom estar só", "Deus disse isso antes do pecado existir. Solidão é campo aberto para o vício.", "Mande mensagem para um amigo hoje."], ["Eclesiastes 4:9-10", "Quem te levanta?", "Ai de quem cai sozinho. Dois são melhores que um.", "Escolha quem será o seu parceiro de prestação de contas."], ["Hebreus 10:24-25", "Não falte", "Abandonar a reunião é o primeiro passo para abandonar o resto.", "Vá à igreja ou ao grupo nesta semana."], ["Provérbios 27:17", "Ferro afia ferro", "Homem que não tem quem o confronte fica cego. Procure quem te incomode por amor.", "Peça a alguém que pergunte como você está, de verdade."], ["Gálatas 6:2", "Carga dividida", "Carregar sozinho não é força, é orgulho.", "Conte uma parte da sua luta para alguém."], ["Salmos 68:6", "Família para o solitário", "Deus coloca o solitário em família. Às vezes isso começa com um café.", "Aceite o próximo convite que receber."], ["Mateus 11:28", "Vinde a mim", "Jesus chama os cansados, não os perfeitos.", "Ore cinco minutos sem pedir nada."], ["Salmos 34:18", "Perto do quebrado", "Quanto mais quebrado, mais perto. Deus não se afasta de quem está no chão.", "Conte a Deus como você está de verdade."], ["Hebreus 4:15-16", "Ele entende", "Jesus foi tentado. Vá ao trono com confiança, e não com medo.", "Na próxima tentação, ore antes de lutar."], ["Deuteronômio 31:6", "Não te deixa", "A promessa é para quem vai entrar em batalha.", "Escreva essa frase e deixe à vista."], ["Provérbios 24:16", "Sete vezes e levanta", "O justo não é quem não cai. É quem levanta.", "Se caiu, zere o contador e recomece hoje, sem drama."], ["Miquéias 7:8", "Não se alegre, inimigo", "Caí, mas vou levantar. Diga isso em voz alta.", "Repita essa frase três vezes."], ["Salmos 103:12", "Longe demais", "Do oriente ao ocidente: os dois nunca se encontram. O que Deus perdoou não volta.", "Pare de reprisar a queda na cabeça."], ["Isaías 1:18", "Mais branco que a neve", "Não existe mancha que passe do alcance. Venha discutir com Deus.", "Leia esse versículo depois de confessar."], ["Lucas 15:20", "O pai correu", "O filho voltou ensaiando um discurso. O pai correu antes de ouvir.", "Volte a orar hoje, mesmo envergonhado."], ["João 21:17", "Pedro voltou", "Jesus restaurou Pedro depois de três negações, e ainda deu trabalho a ele.", "Volte a servir: Deus não te aposentou."], ["Salmos 51:12", "Devolve a alegria", "Depois da queda, peça a alegria de volta. É um pedido bíblico.", "Faça algo que te lembre da alegria com Deus."], ["2 Coríntios 7:10", "Dois tipos de tristeza", "Uma leva ao arrependimento, a outra leva à morte. Remorso paralisa; arrependimento muda de rota.", "Escreva o que muda a partir de hoje."], ["João 8:11", "Vai e muda", "Jesus não condena, e também não deixa como está.", "Mude hoje uma regra que falhou."], ["Romanos 5:20", "Graça maior", "Onde o pecado cresceu, a graça cresceu mais. Graça não é licença: é força.", "Agradeça pela graça antes de dormir."], ["Efésios 5:25", "Amar como Cristo", "O padrão é entrega, não consumo.", "Faça algo por sua esposa ou por quem você ama, sem avisar."], ["Provérbios 5:18", "Alegria em casa", "A Bíblia manda se alegrar com a própria esposa. A tela rouba isso de você.", "Se for casado, tire um tempo a sós com ela."], ["Hebreus 13:4", "Leito honrado", "O casamento merece honra de todos, a começar por você.", "Solteiro ou casado: decida como vai honrar o casamento."], ["1 Pedro 3:7", "Com honra", "Tratar a esposa com honra afeta até a oração.", "Peça perdão por algo específico."], ["Colossenses 3:19", "Sem aspereza", "Vício deixa o homem irritado em casa. Repare em como você tem falado.", "Fale com calma hoje, mesmo cansado."], ["Efésios 4:25", "Falem a verdade", "Confiança não sobrevive à mentira. Com orientação, procure o momento de contar.", "Peça a um líder ajuda para abrir o jogo."], ["1 Coríntios 13:6", "O amor se alegra com a verdade", "Amar é preferir a verdade à aparência.", "Pare de fingir em uma área hoje."], ["Efésios 4:32", "Perdoem-se", "Quem recebeu perdão tem do que dar.", "Libere alguém que você vem cobrando."], ["Amós 3:3", "Andar junto", "Só anda junto quem combina o caminho.", "Combine com alguém uma meta para este mês."], ["Josué 24:15", "Eu e minha casa", "Decisão de homem define a direção da casa.", "Ore pela sua casa em voz alta."], ["Efésios 2:10", "Feito para algo", "Você foi criado para obras preparadas. Vício é distração cara.", "Escreva o que você faria com o tempo que o vício levava."], ["Jeremias 29:11", "Há planos", "Deus falou de esperança a um povo no exílio. Lugar ruim não é fim.", "Escreva um plano para os próximos 12 meses."], ["1 Timóteo 4:12", "Seja exemplo", "Alguém está olhando para você, mesmo sem dizer.", "Pense em quem seria afetado se você mudasse."], ["Mateus 5:14", "Luz", "Luz não se esconde. O que antes era vergonha pode virar testemunho.", "Encoraje hoje alguém que está lutando."], ["2 Coríntios 5:17", "Coisa nova", "O velho passou. Sua identidade não é o vício.", "Pare de se chamar de viciado na sua oração: você é filho."], ["Filipenses 3:13-14", "Para a frente", "Paulo esquece o que ficou para trás e corre.", "Escreva o próximo objetivo."], ["Romanos 8:28", "Nada se perde", "Deus aproveita até a sua luta para fazer o bem.", "Agradeça pelo que aprendeu nesses dias."], ["Isaías 40:31", "Força nova", "Quem espera em Deus renova as forças. Cansaço não é sinal para desistir.", "Descanse hoje de verdade: durma cedo."], ["Salmos 37:5", "Entrega o caminho", "Entregar é sair do comando.", "Entregue a Deus um medo específico."], ["Provérbios 3:5-6", "Confia", "Não se apoie só no que você entende. Ele endireita o caminho.", "Peça direção para uma decisão que está pendente."], ["Hebreus 12:1", "Larga o peso", "Corrida longa pede corpo leve. Larga o que atrapalha.", "Elimine mais uma coisa que pesa."], ["Gálatas 6:9", "Não se canse", "A colheita vem no tempo certo para quem não desiste.", "Anote quantos dias você já venceu."], ["1 Coríntios 15:58", "Firmes", "Nada do que se faz para Deus é em vão.", "Faça hoje o que combinou, sem vontade mesmo."], ["Tiago 1:12", "Feliz o que aguenta", "Quem suporta a prova recebe a coroa.", "Agradeça pela última tentação vencida."], ["Tiago 4:7", "Ele foge", "Primeiro submeter-se a Deus, depois resistir. Nessa ordem.", "Ajoelhe-se por um minuto antes de dormir."], ["Salmos 40:2", "Tirou do poço", "Deus tira do lodo e firma os pés. Lembre de onde saiu.", "Escreva como você estava no dia 1."], ["Romanos 8:37", "Mais que vencedor", "Não é pela sua força, é por quem te amou.", "Celebre com alguém o caminho até aqui."], ["João 16:33", "Ele já venceu", "Vai ter aflição. E Ele já venceu.", "Faça sua lista de vitórias destes dias."], ["2 Timóteo 4:7", "Combati", "Guardar a fé é luta até o fim. Os 90 dias não encerram a caminhada.", "Escreva as regras que você vai manter depois do dia 90."], ["Filipenses 4:13", "Tudo nele", "Noventa dias. Não foi você sozinho. Continue.", "Conte a alguém o que Deus fez, e ajude o próximo a começar."]],SOS=["Levante agora. Saia do quarto ou do lugar onde você está.", "Deixe o celular em outro cômodo.", "Respire fundo 10 vezes, bem devagar.", "Ore em voz alta: \"Senhor, eu não vou fazer isso. Me mostra a saída.\"", "Lembre: Deus é fiel, e junto com a tentação ele dá o escape (1 Coríntios 10:13).", "Mande mensagem para o seu parceiro de confiança, ou saia para andar 10 minutos."],GAT=["Tarde da noite", "Sozinho em casa", "Cansaço", "Estresse", "Tédio", "Solidão", "Briga em casa", "Rede social", "Depois de beber", "Celular na cama"];var S={};try{S=JSON.parse(localStorage.getItem('c90')||'{}')}catch(e){}
S.gat=S.gat||{};S.inicio=S.inicio||Date.now();S.quedas=S.quedas||0;var aba='hoje',ver=null;
function salva(){try{localStorage.setItem('c90',JSON.stringify(S))}catch(e){}}salva();
function dias(){return Math.floor((Date.now()-S.inicio)/864e5)}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function dev(i){var d=D[i];return '<div class="c"><p class="ref">Dia '+(i+1)+' · '+esc(d[0])+'</p><h2 style="margin:4px 0 6px">'+esc(d[1])+'</h2><p>'+esc(d[2])+'</p><p class="acao">Hoje: '+esc(d[3])+'</p></div>'}
function hoje(){var n=dias(),i=Math.min(89,n);return '<div class="c" style="text-align:center"><p class="s">Dias livres</p><p class="n">'+n+'</p><p class="s">de 90</p></div><button class="b sos" type="button" id="sos">BOTÃO DE SOCORRO</button>'+dev(i)+'<button class="b v" type="button" id="caiu">Eu caí, quero recomeçar</button>'}
function sos(){return '<h1>Calma. Faça isso agora.</h1><div class="c"><ol>'+SOS.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div><div class="c"><b>Em desespero, não fique sozinho.</b><p style="margin-top:6px">O CVV atende 24 horas, de graça, pelo telefone 188.</p></div><button class="b" type="button" id="passou">Passou. Voltar.</button>'}
function todos(){var h='<h1>Os 90 devocionais</h1><div class="dias">';for(var i=0;i<90;i++)h+='<button type="button" data-v="'+i+'" class="'+(i<=dias()?'on':'')+'">'+(i+1)+'</button>';h+='</div>';if(ver!=null)h+=dev(ver);return h}
function mapa(){var h='<h1>Mapa dos gatilhos</h1><p class="s">Marque o que abre a porta para a queda. Só fica no seu celular.</p><div class="c">';GAT.forEach(function(g){h+='<label class="ch"><input type="checkbox" data-g="'+esc(g)+'"'+(S.gat[g]?' checked':'')+'> '+esc(g)+'</label>'});h+='</div><h2>Meu plano para a hora do gatilho</h2><textarea id="pl" placeholder="O que eu vou fazer quando isso acontecer?">'+esc(S.plano||'')+'</textarea><p class="s" style="margin-top:12px">Quedas registradas: '+S.quedas+'</p>';return h}
function desenha(){var c=document.getElementById('c');c.innerHTML=aba==='hoje'?hoje():aba==='sos'?sos():aba==='todos'?todos():mapa();
 document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.a===aba)});
 var el=document.getElementById('sos');if(el)el.onclick=function(){aba='sos';desenha();scrollTo(0,0)};
 el=document.getElementById('passou');if(el)el.onclick=function(){aba='hoje';desenha();scrollTo(0,0)};
 el=document.getElementById('caiu');if(el)el.onclick=function(){if(confirm('Zerar o contador? Queda não é o fim: recomece hoje.')){S.inicio=Date.now();S.quedas++;salva();desenha();scrollTo(0,0)}};
 c.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){ver=+b.dataset.v;desenha()}});
 c.querySelectorAll('[data-g]').forEach(function(i){i.onchange=function(){S.gat[i.dataset.g]=i.checked;salva()}});
 el=document.getElementById('pl');if(el)el.oninput=function(){S.plano=el.value;salva()}}
document.querySelectorAll('.nav button').forEach(function(b){b.onclick=function(){aba=b.dataset.a;ver=null;desenha();scrollTo(0,0)}});desenha();
</script></body></html>
